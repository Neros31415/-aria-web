name: ARIA Factory runner checks

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["feat/aria-factory-runner"]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check scripts/aria-factory.mjs
          node --check scripts/aria-factory-status.mjs
          node --check app.js
          node --check sw.js
      - name: Check patch whitespace
        run: git diff --check
