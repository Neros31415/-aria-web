name: ARIA Factory runner checks

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["feat/aria-factory-runner"]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check scripts/aria-factory.mjs
          node --check scripts/aria-factory-validation.mjs
          node --check scripts/aria-factory-status.mjs
          node --check tests/aria-factory-validation.test.mjs
          node --check app.js
          node --check sw.js
      - name: Test Factory patch validation
        run: node --test tests/aria-factory-validation.test.mjs
      - name: Check patch whitespace
        run: git diff --check
