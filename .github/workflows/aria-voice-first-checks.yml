name: ARIA voice-first checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/aria-voice-first-onboarding]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js && node --check visualization-engine.js && node --check cloudflare/aria-brain-staging.mjs
      - run: node --test tests/aria-voice-first.test.mjs
